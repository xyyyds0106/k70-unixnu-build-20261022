name: K70 pinned source kernel

# Manual-only, source-kernel milestone. This workflow has not been run here.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Source baseline or minimal CPU/platform entry candidate
        type: choice
        options: [source, platform]
        default: source

permissions:
  contents: read

concurrency:
  group: k70-source-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  CORE_REF: b6ae99c17194e6a18fd819d3148e69fe405e91fc
  DEVICE_REF: d4dbb3683023a17bb468b9774f52c87f3060e739
  BUILD_PROFILE: ${{ inputs.profile || 'source' }}

jobs:
  kernel:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the source-build configuration
        uses: actions/checkout@v4
        with:
          repository: mansar1337/UniXNU-vermeer
          ref: d4dbb3683023a17bb468b9774f52c87f3060e739
          path: device
          persist-credentials: false

      - name: Checkout its pinned UniXNU build system
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: b6ae99c17194e6a18fd819d3148e69fe405e91fc
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and record the pinned source-only board
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          root = Path(os.environ["GITHUB_WORKSPACE"])
          records = {}
          for directory, expected in (("upstream", os.environ["CORE_REF"]),
                                      ("device", os.environ["DEVICE_REF"])):
              source = root / directory
              actual = subprocess.check_output(
                  ["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
              if actual != expected:
                  raise SystemExit(f"{directory}: expected {expected}, got {actual}")
              submodules = subprocess.check_output(
                  ["git", "-C", str(source), "submodule", "status", "--recursive"], text=True)
              if any(line and line[0] != " " for line in submodules.splitlines()):
                  raise SystemExit(f"{directory}: submodule revision mismatch")
              records[directory] = {"commit": actual, "submodules": submodules.splitlines()}
          board_path = root / "device/board.toml"
          board = tomllib.loads(board_path.read_text())
          if board["board"]["name"] != "vermeer" or board["board"]["soc"] != "SM8550":
              raise SystemExit("Unexpected board identity")
          if any(key in board for key in ("userdata", "ipsw", "payload")) or "prelink" in board["kernel"]:
              raise SystemExit("Expected the source-only board without GPT, IPSW, payload or prelink")
          expected_archives = ["build-libpthread-kernel.py", "build-corecrypto-14.py",
                               "build-corecrypto-14.py --namespace"]
          if board["kernel"]["archives"] != expected_archives:
              raise SystemExit("Unexpected source-baseline archive recipe")
          records["board_sha256"] = hashlib.sha256(board_path.read_bytes()).hexdigest()
          records["profile"] = os.environ["BUILD_PROFILE"]
          records["scope"] = "Source XNU only; no prelink, firmware, GPT patch or device execution"
          (root / "ci-artifacts/sources.json").write_text(json.dumps(records, indent=2) + "\n")
          PY

      - name: Install the baseline host tools
        run: |
          set -euo pipefail
          brew install cmake ninja unifdef llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Record Xcode and the SDK tool resolution used by XNU
        run: |
          set -euo pipefail
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcode-select -p
            python3 --version
            for sdk in macosx iphoneos; do
              sdk_path="$(xcrun --sdk "$sdk" --show-sdk-path)"
              printf '%s SDK: %s\n' "$sdk" "$sdk_path"
              xcrun --sdk "$sdk" --show-sdk-version
              # XNU MakeInc.cmd resolves MIG with the selected SDK's absolute path.
              mig="$(xcrun --sdk "$sdk_path" --find mig)"
              test -x "$mig"
              printf '%s MIG: %s\n' "$sdk" "$mig"
              for diagnostic_tool in migcom iig; do
                xcrun --sdk "$sdk_path" --find "$diagnostic_tool" || true
              done
            done
            xcrun --sdk iphoneos --find clang
            for tool in git make clang cmake ninja unifdef xcrun xcodebuild; do
              command -v "$tool"
            done
            make --version
            clang --version
            brew list --versions
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/toolchain.txt"

      - name: Check the configuration and optional-display patch guard
        working-directory: device
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/unit-tests.log"
          python3 tools/build_source_kernel.py --unixnu "$GITHUB_WORKSPACE/upstream" \
            --profile "$BUILD_PROFILE" --check \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/configuration-check.log"

      - name: Build the source kernel and collect its real symbols and HMAC
        working-directory: device
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          python3 -u tools/build_source_kernel.py \
            --unixnu "$GITHUB_WORKSPACE/upstream" --out "$GITHUB_WORKSPACE/out" \
            --jobs 4 --profile "$BUILD_PROFILE" \
            2>&1 | tee "$GITHUB_WORKSPACE/out/build-console.log"

      - name: Preserve the selected configuration and source lock
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          for relative in upstream/feeds.toml device/board.toml device/unixnu.lock \
              device/configs/vermeer_build_defconfig device/configs/vermeer_platform_defconfig \
              device/tools/build_source_kernel.py device/tools/prepare_kernel_patches.py; do
            if [ -f "$GITHUB_WORKSPACE/$relative" ]; then
              destination="$GITHUB_WORKSPACE/ci-artifacts/$relative"
              mkdir -p "$(dirname "$destination")"
              cp "$GITHUB_WORKSPACE/$relative" "$destination"
            fi
          done
          printf '%s\n' \
            'Source kernel milestone only; no prelink or phone boot image.' \
            'No firmware, GPT geometry patch, userdata, payload or device test.' \
            'A successful build does not establish K70 entry, interrupts or full OS support.' \
            > "$GITHUB_WORKSPACE/ci-artifacts/scope.txt"

      - name: Upload the validated source kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: k70-source-${{ env.BUILD_PROFILE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/vermeer/kernel/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload symbols, configuration and logs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k70-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-artifacts/**
            out/build-console.log
            out/vermeer/logs/**
            out/vermeer/.config
            out/vermeer/tree/build/xnu/ios-sym/**
            out/vermeer/tree/build/corecrypto-2023/build-report*.json
            out/vermeer/tree/build/libpthread-kernel/build-report.json
            out/vermeer/tree/build/armcpu/**
            out/vermeer/tree/build/armdt-platform/**
            out/vermeer/tree/.cache/vermeer-patch-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
